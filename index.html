.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}

.grid{display:grid;gap:14px;grid-template-columns:1fr}

@media(min-width:760px){.grid.four{grid-template-columns:repeat(4,1fr)}}

.lbl{font-size:13px;color:var(--ink2)}
.val{font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
.delta{font-size:13px;margin-top:2px;display:inline-flex;gap:4px;align-items:center}
.up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--ink2)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.note{font-size:12.5px;color:var(--ink2)}

svg text{font:11px system-ui,-apple-system,sans-serif;fill:var(--ink2)}
.bar{transition:opacity .12s}
.bar:hover,.bar:focus{outline:none;opacity:.8}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;max-width:240px}

#tip .k{width:12px;height:3px;border-radius:2px;flex:none}

.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:13px;z-index:30;max-width:90%}
.drop{border:1.5px dashed var(--axis);border-radius:12px;padding:16px;text-align:center}
.drop.over{background:var(--wash);border-color:var(--accent)}
.ok{color:var(--pos)}.bad{color:var(--neg)}
footer{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}
@media(forced-colors:active){.bar{stroke:CanvasText}}

  ps.forEach(p=>{const cs=integrity(p.v);chk.append(h('div',{class:'row'},h('b',{text:pLabel(p)}),h('span',{class:'note',text:p.src})));
    cs.forEach(c=>chk.append(h('div',{class:'row',style:'padding:4px 0'},h('span',{class:'note',text:c.label}),h('span',{class:c.ok?'ok':'bad',text:c.ok?'✓ ties':`✗ ${num(c.a)} vs ${num(c.b)}`}))));
    if(p.restated&&p.restated.length)p.restated.forEach(t=>chk.append(flagRow('warning',t,'Possible restatement')))});
  el.append(chk);
  const dz=h('div',{class:'drop',id:'drop'},h('div',{text:'Import accounts: drop iXBRL (.xhtml) files here'}),
    h('div',{class:'note',style:'margin:6px 0 10px',text:'On Companies House, open the accounts filing and use “Download iXBRL”. The Dec 2023 file also contains Mar 2023 as its comparative, so one file adds two periods. Later filings win where figures overlap.'}),
    h('label',{class:'btn'},'Choose files',h('input',{type:'file',accept:'.xhtml,.html,.xml',multiple:true,style:'display:none',onchange:e=>{importFiles([...e.target.files]);e.target.value=''}})));
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');importFiles([...e.dataTransfer.files])});
  el.append(h('div',{class:'card'},dz));
}

function renderPeople(){
  const el=$('#t-people');el.replaceChildren();
  const cur=S.officers.filter(o=>!o.resigned),res=S.officers.filter(o=>o.resigned);
  const wk=!!S.settings.worker;
  const tenure=o=>{const m=months(o.appointed,o.resigned||today());return m>=12?(m/12).toFixed(1)+' yrs':m+' mo'};
  const other=o=>{const l=S.links[o.id];if(!l)return wk?'not yet checked':'needs live check';
    const act=Object.values(l).filter(x=>!x.resigned);return act.length+' active'+(Object.keys(l).length>act.length?`, ${Object.keys(l).length-act.length} resigned`:'')};
  const tbl=(list,showRes)=>h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},h('th',{text:'Name'}),h('th',{text:'Role'}),h('th',{text:'Appointed'}),showRes?h('th',{text:'Resigned'}):h('th',{text:'Tenure'}),h('th',{text:'Other appointments'}))),
    h('tbody',{},...list.map(o=>h('tr',{},h('td',{},h('a',{href:`https://find-and-update.company-information.service.gov.uk/officers/${o.id}/appointments`,target:'_blank',rel:'noopener',text:o.name})),
      h('td',{text:o.role}),h('td',{class:'n',text:fmtD(o.appointed)}),h('td',{class:'n',text:showRes?fmtD(o.resigned):tenure(o)}),h('td',{text:other(o)}))))));
  el.append(h('div',{class:'card'},h('h2',{text:`Current officers (${cur.length})`}),tbl(cur,false),
    h('div',{class:'note',style:'margin-top:8px',text:'Three directors were appointed together on 13 Nov 2023, eight months before the March 2024 strike-off notice and the filing catch-up. Names link to each person’s other appointments on Companies House.'})));
  el.append(h('div',{class:'card'},h('h2',{text:`Resigned (${res.length})`}),tbl(res,true)));
  const lk=Object.entries(S.links).flatMap(([id,m])=>Object.entries(m).map(([n,c])=>({id,n,c,who:(S.officers.find(o=>o.id===id)||{}).name})));
  el.append(h('div',{class:'card'},h('h2',{text:'Directors’ other companies'}),
    lk.length?h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},h('th',{text:'Director'}),h('th',{text:'Company'}),h('th',{text:'Status'}),h('th',{text:'Appointed'}),h('th',{text:'Resigned'}))),
      h('tbody',{},...lk.map(x=>h('tr',{},h('td',{text:x.who}),h('td',{},h('a',{href:`https://find-and-update.company-information.service.gov.uk/company/${x.n}`,target:'_blank',rel:'noopener',text:x.c.name||x.n})),h('td',{text:x.c.status||''}),h('td',{class:'n',text:x.c.appointed?fmtD(x.c.appointed):''}),h('td',{class:'n',text:x.c.resigned?fmtD(x.c.resigned):''}))))))
    :h('div',{class:'note',text:wk?'Run a check from Setup to load other appointments.':'Needs the Worker (Setup tab). Companies House does not allow the browser to call it directly.'})));
}

function renderFilings(){
  const el=$('#t-filings');el.replaceChildren();
  const cats=[['all','All'],['accounts','Accounts'],['confirmation','Confirmation'],['officers','Officers'],['psc','PSC'],['address','Address'],['gazette','Gazette'],['attention','Flagged']];
  const cur=el.dataset.f||'all';
  const chips=h('div',{class:'chips',role:'group','aria-label':'Filter'},...cats.map(([k,l])=>h('button',{'aria-pressed':String(cur===k),text:l,onclick:()=>{el.dataset.f=k;renderFilings()}})));
  const list=S.filings.filter(f=>cur==='all'||(cur==='attention'?f.att:f.cat===cur));
  el.append(h('div',{class:'card'},chips,...list.map(f=>h('div',{class:'row'},h('span',{},h('span',{class:'tag'+(f.att?' att':''),text:f.type}),' ',f.desc),h('span',{class:'note',text:fmtD(f.date)}))),
    !list.length?h('div',{class:'note',text:'Nothing in this category.'}):null,
    S.coverage?h('div',{class:'note',style:'margin-top:10px',text:S.coverage}):null));
}

function renderSetup(){
  const el=$('#t-setup');el.replaceChildren();
  const w=S.settings.worker;
  const inp=h('input',{type:'url',id:'wurl',placeholder:'https://langdon-ch.<your-subdomain>.workers.dev',value:w||'',autocapitalize:'off',autocomplete:'off'});
  el.append(h('div',{class:'card'},h('h2',{text:'Live monitoring'}),
    h('p',{class:'note',text:'Companies House blocks direct browser access, so live checks go through a small Cloudflare Worker (worker.js in this folder) that holds your API key. Without it the app shows the data it was seeded with and anything you import.'}),
    inp,h('div',{style:'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap'},
      h('button',{class:'btn',onclick:()=>{S.settings.worker=inp.value.trim().replace(/\/$/,'');save();toast('Saved');renderAll()},text:'Save'}),
      h('button',{class:'btn sec',onclick:()=>runCheck(true),text:'Run check now'})),
    h('div',{class:'note',style:'margin-top:8px',text:S.lastCheck?'Last check: '+new Date(S.lastCheck).toLocaleString('en-GB'):'Never checked live.'}),
    h('div',{class:'note',style:'margin-top:6px',text:'First live check takes a baseline (no alerts), fills in any accounts not yet loaded, then later checks report new directors, resignations, other-company appointments, new filings and new accounts.'})));
  el.append(h('div',{class:'card'},h('h2',{text:'Data'}),
    h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{class:'btn sec',text:'Export backup',onclick:()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),download:`langdon-monitor-${today()}.json`});a.click()}}),
      h('label',{class:'btn sec'},'Restore backup',h('input',{type:'file',accept:'.json',style:'display:none',onchange:async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(!s.periods)throw 0;S=s;save();renderAll();toast('Restored')}catch(_){toast('Not a valid backup')}}})),
      h('button',{class:'btn sec',text:'Reset to seed data',onclick:()=>{if(confirm('Discard imported data and checks?')){localStorage.removeItem(KEY);S=load();renderAll()}}}))));
  if(S.events.length)el.append(h('div',{class:'card'},h('h2',{text:'Activity log'}),...S.events.slice(0,15).map(e=>h('div',{class:'row'},h('span',{text:e.text}),h('span',{class:'note',text:new Date(e.at).toLocaleDateString('en-GB')})))));
  el.append(h('div',{class:'card'},h('h2',{text:'Where the numbers came from'}),
    ...sortedPeriods().map(p=>h('div',{class:'row'},h('span',{text:pLabel(p)}),h('span',{class:'note',text:p.src}))),
    h('div',{class:'note',style:'margin-top:8px',text:'Officers and filings come from Companies House (public pages, or the live API once the Worker is connected). Nothing here is estimated.'})));
}

function renderAll(){
  renderOverview();renderAccounts();renderPeople();renderFilings();renderSetup();
  const nm=S.lastCheck?'Live check '+new Date(S.lastCheck).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'Seed data, not live';
  const ps=sortedPeriods();
  $('#fresh').textContent=`${nm}. Latest accounts: year to ${ps.length?fmtD(ps[ps.length-1].end):'n/a'}.`;
  $('#ver').textContent='Langdon Monitor '+VERSION;
}

/* ---------- Live check via Worker ---------- */
async function api(path){
  const r=await fetch(S.settings.worker+path);
  if(!r.ok)throw new Error(`${path} → ${r.status}`);return r.json();
}
async function runCheck(manual){
  const w=S.settings.worker;if(!w){if(manual)toast('Add the Worker URL first');return}
  try{
    if(manual)toast('Checking Companies House…');
    const [prof,off,fil]=await Promise.all([api(`/company/${COMPANY}`),api(`/company/${COMPANY}/officers?items_per_page=100`),api(`/company/${COMPANY}/filing-history?items_per_page=100`)]);
    const ev=[],base=!S.baselined,now=new Date().toISOString();
    const push=(sev,text)=>{if(!base)ev.push({at:now,sev,text})};
    if(prof.company_status&&prof.company_status!=='active')push('critical',`Company status is now “${prof.company_status}”`);
    if(prof.company_status)$('#status').textContent=prof.company_status.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
    // officers
    const newOff=(off.items||[]).map(o=>{const id=((o.links&&o.links.officer&&o.links.officer.appointments)||'').split('/')[2]||o.name;
      return{id,name:o.name,role:(o.officer_role||'').replace(/^./,c=>c.toUpperCase()),appointed:o.appointed_on,resigned:o.resigned_on||undefined}});
    for(const o of newOff){const old=S.officers.find(x=>x.id===o.id||(x.name.toLowerCase()===o.name.toLowerCase()));
      if(!old)push('serious',`New ${o.role.toLowerCase()} appointed: ${o.name} (${fmtD(o.appointed)})`);
      else if(o.resigned&&!old.resigned)push('serious',`${o.name} resigned as ${o.role.toLowerCase()} (${fmtD(o.resigned)})`)}
    S.officers=newOff;
    // other appointments
    for(const o of newOff.filter(x=>x.role!=='Secretary'||true)){
      try{
        const ap=await api(`/officers/${o.id}/appointments?items_per_page=50`);const cur={};
        for(const it of ap.items||[]){const n=it.appointed_to&&it.appointed_to.company_number;if(!n||n===COMPANY)continue;
          cur[n]={name:it.appointed_to.company_name,status:it.appointed_to.company_status,appointed:it.appointed_on,resigned:it.resigned_on||undefined}}
        const old=S.links[o.id]||{};
        for(const[n,c]of Object.entries(cur)){
          if(!old[n])push('warning',`${o.name}: new appointment at ${c.name} (${n})${c.resigned?'':''}`);
          else{if(c.resigned&&!old[n].resigned)push('warning',`${o.name} resigned from ${c.name}`);
            if(c.status!==old[n].status)push('warning',`${c.name} (${o.name}) status changed: ${old[n].status} → ${c.status}`)}}
        S.links[o.id]=cur;
      }catch(e){console.warn('appointments',o.id,e.message)}
    }
    // filings
    const live=(fil.items||[]).map(f=>{const dv=f.description_values||{},desc=cleanDesc(f);
      return{date:f.date,type:f.type,cat:mapCat(f.category,f.type),desc,att:/GAZ|DISS|SOAS|STRIKE/.test(f.type||'')||/replacement/i.test(desc),tid:f.transaction_id,
        meta:f.links&&f.links.document_metadata,end:f.category==='accounts'?(dv.made_up_date||parseLongDate(dv.description||desc)):null}});
    const seen=new Set(S.filings.map(f=>f.tid).filter(Boolean));
    if(!base)for(const f of live)if(!seen.has(f.tid))push(f.att?'serious':'info',`New filing (${f.type}): ${f.desc}, ${fmtD(f.date)}`);
    S.filings=live;S.coverage=null;
    // accounts: download each filed iXBRL once; load it, or check it against the figures already held
    S.docsChecked=S.docsChecked||{};
    for(const f of live.filter(x=>x.cat==='accounts'&&x.meta&&x.end&&!S.docsChecked[x.tid])){
      try{
        const r=await fetch(`${w}/document?meta=${encodeURIComponent(f.meta)}`);if(!r.ok)throw new Error('HTTP '+r.status);
        const m=mergeImport(parseIxbrl(await r.text()),'Companies House filing '+fmtD(f.date));
        S.docsChecked[f.tid]=true;
        const out=(m.added.length||m.updated.length)?'loaded':m.notes.length?'differs: '+m.notes.join('; '):'matches the figures already held';
        ev.push({at:now,sev:m.notes.length?'warning':'info',text:`Accounts for year to ${fmtD(f.end)} (filed ${fmtD(f.date)}): ${out}`});
      }catch(e){console.warn('doc',e.message);ev.push({at:now,sev:'info',text:`Could not download accounts for year to ${fmtD(f.end)}: ${e.message}`})}
    }
    S.baselined=true;S.lastCheck=now;S.events=[...ev,...S.events].slice(0,100);save();renderAll();
    if(manual)toast(base?'Baseline captured':ev.length?`${ev.length} change(s) found`:'No changes');
  }catch(e){console.error(e);if(manual)toast('Check failed: '+e.message)}
}
function mapCat(c,t){c=c||'';if(c==='accounts')return'accounts';if(c==='confirmation-statement')return'confirmation';if(c==='officers')return'officers';
  if(/psc|persons/.test(c)||/^PSC/.test(t||''))return'psc';if(c==='address')return'address';if(c==='gazette')return'gazette';if(c==='capital')return'capital';return'other'}
function cleanDesc(f){const dv=f.description_values||{};
  if(dv.description)return dv.description;
  let d=(f.description||'').replace(/\{(\w+)\}/g,(m,k)=>dv[k]||m).replace(/-/g,' ');
  d=d.charAt(0).toUpperCase()+d.slice(1);
  if(dv.made_up_date&&!/made up to/i.test(d))d+=' made up to '+fmtDL(dv.made_up_date);
  return d||f.type||''}

/* ---------- Boot ---------- */
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  document.querySelectorAll('section').forEach(s=>s.hidden=s.id!=='t-'+b.dataset.tab);scrollTo(0,0);hideTip();
}));
window.__app={parseIxbrl,mapFact,integrity,mergeImport,get S(){return S}};
renderAll();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(S.settings.worker&&(!S.lastCheck||Date.now()-new Date(S.lastCheck)>6*3600e3))runCheck(false);
</script>
